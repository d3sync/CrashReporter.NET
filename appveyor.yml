version: 2.0.0.{build}
environment:
  my_version: 2.0.0
  my_secret:
    secure: eXAIysIG8npt2tVMYQpGwTLj47CK9lUB/NyEfVGgc90=
skip_branch_with_pr: true
image: Visual Studio 2022
clone_folder: c:\projects\CrashReporter.NET
build: off
platform: Any CPU
configuration: Release
install:
- nuget install secure-file -ExcludeVersion
- secure-file\tools\secure-file -decrypt "c:\projects\CrashReporter.NET\CrashReporter.NET\CrashReporter.NET.snk.enc" -secret %my_secret%
- ps: |
    Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
    ./dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:ProgramFiles\dotnet"
- dotnet --info

build_script:
- dotnet build "c:\projects\CrashReporter.NET\CrashReporter.NET.sln" -c Release
- dotnet pack "c:\projects\CrashReporter.NET\CrashReporter.NET\CrashReporter.NET.csproj" -c Release --no-build -o "c:\projects\CrashReporter.NET"
- cmd: 7z a CrashReporter.NET-%my_version%.zip %APPVEYOR_BUILD_FOLDER%\CrashReporter.NET\bin\Release\*

artifacts:
- path: CrashReporter.NET-%my_version%.zip
- path: CrashReporter.NET.Official.%my_version%.nupkg

deploy:
- provider: GitHub
  release: $(APPVEYOR_REPO_TAG_NAME)
  description: '// TODO: Write Release Notes'
  artifact: CrashReporter.NET-%my_version%.zip
  auth_token:
    secure: WHW27Nvc8zNhfyhxIYdl/NwbrkFzvSX0vE4/CS8iByPXM6rcztWhUrDXJ7eejLBY
  draft: false
  prerelease: false
  on:
    branch: master                 # release from master branch only
    appveyor_repo_tag: true        # deploy on tag push only

- provider: NuGet
  api_key:
    secure: tmlnRHVMwKGZ1B+ua5hte55Ig+gfbTi4DjKzzTiRjNwpy9nYgQpDZCnQZB0H9IdS
  skip_symbols: false
  artifact: CrashReporter.NET.Official.%my_version%.nupkg
  on:
    branch: master                 # release from master branch only
    appveyor_repo_tag: true        # deploy on tag push only
