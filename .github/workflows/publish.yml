name: Build and publish

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]          # pushing a tag like v2.0.0 publishes version 2.0.0 to nuget.org
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # net48 and Windows Forms targets require a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            # Non-release builds get a unique prerelease version; they are built and uploaded as artifacts only.
            [xml]$project = Get-Content CrashReporter.NET/CrashReporter.NET.csproj
            $base = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            $version = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version"

      - name: Restore
        run: dotnet restore CrashReporter.NET.sln

      - name: Build
        run: dotnet build CrashReporter.NET.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack CrashReporter.NET/CrashReporter.NET.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Optional: add protection rules (e.g. required reviewers) to this environment in the repository settings.
    environment: release
    permissions:
      id-token: write   # required to request the GitHub OIDC token used by NuGet trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Exchanges the GitHub OIDC token for a short-lived (1 hour) nuget.org API key.
      - name: NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (not e-mail)

      # Pushing the .nupkg also pushes the matching .snupkg symbol package.
      - name: Push to nuget.org
        shell: bash
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
